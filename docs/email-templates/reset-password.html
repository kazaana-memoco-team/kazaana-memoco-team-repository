<!--
  Supabase Auth テンプレート: Reset Password
  Subject: 【JAPAN BENEFITS】パスワード再設定のご案内
  type=recovery / リンクは japan-benefits.jp/auth/confirm に向ける（README参照）
-->
<div style="max-width:480px;margin:0 auto;font-family:-apple-system,'Hiragino Kaku Gothic ProN',Meiryo,sans-serif;color:#1a1a1a;">
  <div style="background:#99201c;padding:24px;text-align:center;">
    <span style="color:#fff;font-size:18px;font-weight:bold;letter-spacing:1px;">JAPAN BENEFITS</span><br>
    <span style="color:#f0d9b5;font-size:11px;">produced by BECOS</span>
  </div>
  <div style="padding:32px 24px;">
    <h1 style="font-size:18px;margin:0 0 16px;">パスワードの再設定</h1>
    <p style="font-size:14px;line-height:1.8;margin:0 0 24px;">
      パスワード再設定のリクエストを受け付けました。下のボタンから新しいパスワードを設定してください。
    </p>
    <div style="text-align:center;margin:0 0 24px;">
      <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery"
         style="display:inline-block;background:#99201c;color:#fff;text-decoration:none;padding:14px 32px;border-radius:6px;font-size:15px;font-weight:bold;">
        パスワードを再設定する
      </a>
    </div>
    <p style="font-size:12px;color:#888;line-height:1.8;margin:0;">
      このリクエストに心当たりがない場合は、このメールを破棄してください。パスワードは変更されません。<br>リンクの有効期限は1時間です。
    </p>
  </div>
  <div style="border-top:1px solid #eee;padding:20px 24px;font-size:11px;color:#999;line-height:1.7;">
    JAPAN BENEFITS produced by BECOS ／ 運営: 株式会社KAZAANA<br>
    本メールは送信専用です。詳細は <a href="https://japan-benefits.jp" style="color:#99201c;">japan-benefits.jp</a> をご確認ください。
  </div>
</div>
